name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build, Package DMG & Publish Release (macOS 15 arm64)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: swift test --parallel

      - name: Build & bundle PinGate.app + pingate CLI
        run: |
          mkdir -p ./dist/app ./dist/bin ./dist/release
          ./Scripts/bundle_app.sh \
            --output-dir ./dist/app \
            --cli-dir ./dist/bin \
            --version "${{ steps.meta.outputs.version }}"

      - name: Create DMG & CLI tarball
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          DMG_STAGE="./dist/dmg-stage"
          DMG_OUT="./dist/release/PinGate-${VERSION}-arm64.dmg"
          CLI_TAR="./dist/release/pingate-cli-${VERSION}-arm64.tar.gz"

          mkdir -p "${DMG_STAGE}"
          cp -R ./dist/app/PinGate.app "${DMG_STAGE}/PinGate.app"
          ln -s /Applications "${DMG_STAGE}/Applications"

          hdiutil create \
            -volname "PinGate ${VERSION}" \
            -srcfolder "${DMG_STAGE}" \
            -ov \
            -format UDZO \
            "${DMG_OUT}"

          tar -C ./dist/bin -czf "${CLI_TAR}" pingate

          (
            cd ./dist/release
            shasum -a 256 \
              "PinGate-${VERSION}-arm64.dmg" \
              "pingate-cli-${VERSION}-arm64.tar.gz" \
              > SHA256SUMS.txt
          )
          cat ./dist/release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: PinGate ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/release/PinGate-${{ steps.meta.outputs.version }}-arm64.dmg
            dist/release/pingate-cli-${{ steps.meta.outputs.version }}-arm64.tar.gz
            dist/release/SHA256SUMS.txt
